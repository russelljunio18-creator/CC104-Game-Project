<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canteen Rush!</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/players.css">
</head>

<body>

    <main class="game-container">

        <!-- ===== HEADER ===== -->

        <header class="game-header">

            <div class="game-title">
                <h1>CANTEEN RUSH!</h1>
                <p>Campus Lunch Simulator</p>
            </div>

            <div class="game-stats">

                <div class="stat-box">
                    <span>SERVED</span>
                    <h2 id="score">0/10</h2>
                </div>

                <div class="stat-box">
                    <span>TIME LEFT</span>
                    <h2 id="timer">01:00</h2>
                </div>

                <div class="stat-box">
                    <span>WAITING</span>
                    <h2 id="queueCount">0</h2>
                </div>

                <div class="stat-box">
                    <span>WALK-OUTS</span>
                    <h2 id="missed">00</h2>
                </div>

            </div>

        </header>

         <!-- ===== GAME LAYOUT =====-->

        <div class="game-layout">

            <!-- CANTEEN ENVIRONMENT -->

            <section class="canteen-area">

                <!-- Background Wall -->

                <div class="canteen-wall">

                    <!-- Menu Board -->

                    <div class="menu-board">

                        <h3>TODAY'S MENU</h3>

                        <div class="menu-item">
                            <span>Siomai Rice</span>
                            <span>₱35</span>
                        </div>

                        <div class="menu-item">
                            <span>Chicken Adobo</span>
                            <span>₱55</span>
                        </div>

                        <div class="menu-item">
                            <span>Pancit Canton</span>
                            <span>₱25</span>
                        </div>

                        <div class="menu-item">
                            <span>Gulaman</span>
                            <span>₱15</span>
                        </div>

                    </div>

                    <!-- Windows -->

                    <div class="windows">

                        <div class="window"></div>
                        <div class="window"></div>
                        <div class="window"></div>

                    </div>

                    <!-- Wall Clock -->

                    <div class="wall-clock">

                        <div class="clock-hour"></div>
                        <div class="clock-minute"></div>
                        <div class="clock-center"></div>

                    </div>

                </div>

                <!-- Wall Decorations -->

                <div class="wall-tiles"></div>

                <!-- Floor -->

                <div class="canteen-floor"></div>

                   <!-- CASHIER STATION -->

                <div class="cashier-station">

                    <div class="cashier-sign">
                        FOOD COUNTER
                    </div>

                    <!-- Cashier Character -->

                    <div class="cashier">

                        <div class="cashier-hair"></div>

                        <div class="cashier-head">
                            <div class="cashier-eye left-eye"></div>
                            <div class="cashier-eye right-eye"></div>
                            <div class="cashier-mouth"></div>
                        </div>

                        <div class="cashier-body">

                            <div class="cashier-apron"></div>

                            <div class="cashier-arm left-arm"></div>
                            <div class="cashier-arm right-arm"></div>

                        </div>

                    </div>

                    <!-- Counter Table -->

                    <div class="counter-table">

                        <div class="counter-top"></div>

                        <div class="cash-register">
                            <div class="register-screen"></div>
                            <div class="register-buttons"></div>
                        </div>

                        <div class="counter-front">

                            <div class="counter-panel"></div>

                            <div class="counter-name">
                                SERVICE COUNTER
                            </div>

                            <div class="counter-panel"></div>

                        </div>

                    </div>

                </div>


                <!-- CUSTOMER QUEUE -->

                <div class="queue-area">

                    <!-- Customer Characters -->

                    <div id="customerQueue"
                         class="customer-queue">

                        <!-- Customers are generated by JavaScript -->

                    </div>

                    <!-- Queue Path -->

                    <div class="queue-path">

                        <span class="queue-arrow">←</span>
                        <span class="queue-arrow">←</span>
                        <span class="queue-arrow">←</span>
                        <span class="queue-arrow">←</span>
                        <span class="queue-arrow">←</span>

                    </div>

                    <!-- Queue Labels -->

                    <div class="queue-labels">

                        <span class="front-label">
                            FRONT
                        </span>

                        <span class="rear-label">
                            REAR
                        </span>

                    </div>

                </div>


                <!-- CUSTOMER ENTRANCE -->

                <div class="entrance">

                    <div class="entrance-sign">
                        ENTRANCE
                    </div>

                    <div class="door">

                        <div class="door-window"></div>
                        <div class="door-handle"></div>

                    </div>

                </div>

            </section>
